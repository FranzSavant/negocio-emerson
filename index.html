<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negocio Emerson</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">
<style>
  :root{color-scheme:light dark;}
  body{margin:0;background:#ffffff;}
  .markdown-body{box-sizing:border-box;max-width:900px;margin:0 auto;padding:45px 40px;min-height:100vh;}
  @media (max-width:767px){.markdown-body{padding:18px;}}
  .topbar{max-width:900px;margin:0 auto;padding:14px 40px;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:#57606a;background:#ffffff;}
  .topbar a{color:#0969da;text-decoration:none;}
  .topbar a:hover{text-decoration:underline;}
  .alert{padding:12px 16px;border-left:6px solid;border-radius:6px;margin:16px 0;}
  .alert .alert-title{margin:0 0 6px;font-weight:700;}
  .alert.note{border-color:#0969da;background:#ddf4ff;}
  .alert.tip{border-color:#1a7f37;background:#dafbe1;}
  .alert.important{border-color:#8250df;background:#fbefff;}
  .alert.warning{border-color:#9a6700;background:#fff8c5;}
  .alert.caution{border-color:#cf222e;background:#ffebe9;}
  @media (prefers-color-scheme: dark){
    body{background:#0d1117;}
    .topbar{color:#8b949e;background:#0d1117;}
    .topbar a{color:#4493f8;}
    .alert.note{border-color:#4493f8;background:rgba(56,139,253,.15);}
    .alert.tip{border-color:#3fb950;background:rgba(46,160,67,.15);}
    .alert.important{border-color:#a371f7;background:rgba(163,113,247,.15);}
    .alert.warning{border-color:#d29922;background:rgba(187,128,9,.15);}
    .alert.caution{border-color:#f85149;background:rgba(248,81,73,.15);}
  }
</style>
</head>
<body>
<div class="topbar">Negocio Emerson · <a href="?f=README.md">Inicio</a> · <a href="https://github.com/FranzSavant/negocio-emerson">repo</a></div>
<article class="markdown-body" id="content">Cargando…</article>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
(function(){
  const el = document.getElementById('content');
  const siteBase = new URL('.', location.href).pathname;
  function relToRoot(u){
    const p = u.pathname.startsWith(siteBase) ? u.pathname.slice(siteBase.length) : u.pathname;
    return decodeURIComponent(p);
  }
  function styleAlerts(){
    const types = {NOTE:'note',TIP:'tip',IMPORTANT:'important',WARNING:'warning',CAUTION:'caution'};
    el.querySelectorAll('blockquote').forEach(function(bq){
      const m = (bq.textContent||'').match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/);
      if(!m) return;
      const first = bq.querySelector('p');
      if(first) first.innerHTML = first.innerHTML.replace(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/, '');
      const div = document.createElement('div');
      div.className = 'alert ' + types[m[1]];
      const t = document.createElement('p');
      t.className = 'alert-title';
      t.textContent = m[1].charAt(0) + m[1].slice(1).toLowerCase();
      div.appendChild(t);
      while(bq.firstChild){ div.appendChild(bq.firstChild); }
      bq.replaceWith(div);
    });
  }
  async function render(file){
    try{
      const res = await fetch(new URL(file, new URL('.', location.href)), {cache:'no-cache'});
      if(!res.ok) throw new Error(res.status);
      el.innerHTML = marked.parse(await res.text());
      styleAlerts();
      window.scrollTo(0,0);
      document.title = (el.querySelector('h1') ? el.querySelector('h1').textContent : 'Negocio Emerson');
    }catch(e){ el.textContent = 'No se pudo cargar "' + file + '": ' + e; }
  }
  el.addEventListener('click', function(e){
    const a = e.target.closest('a');
    if(!a) return;
    const href = a.getAttribute('href') || '';
    if(/^https?:/i.test(href)) return;
    const target = new URL(href, new URL(currentFile, new URL('.', location.href)));
    const rel = relToRoot(target);
    if(rel.endsWith('.md')){
      e.preventDefault();
      history.pushState({}, '', '?f=' + encodeURIComponent(rel));
      currentFile = rel;
      render(rel);
    }
  });
  window.addEventListener('popstate', function(){
    const f = new URLSearchParams(location.search).get('f') || 'README.md';
    currentFile = f; render(f);
  });
  let currentFile = new URLSearchParams(location.search).get('f') || 'README.md';
  render(currentFile);
})();
</script>
</body>
</html>
